name: Build & Deploy (SFTP)

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install native build tool dependencies
        # gulp-image pulls in mozjpeg/gifsicle/zopflipng/pngquant binaries
        # (via the imagemin "*-bin" packages) that need system shared libs
        # or build tooling as a fallback (see imagemin/pngquant-bin#130).
        # gulp-fontgen shells out to the system `fontforge` binary.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libimagequant0 build-essential autoconf automake libtool pkg-config fontforge

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build theme assets
        run: npx gulp _build

      - name: Stage deployable files
        run: |
          mkdir -p deploy
          rsync -av --exclude-from='.deployignore' ./ deploy/

      - name: Deploy over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.STAGING_USERNAME }}
          server: ${{ vars.STAGING_HOST }}
          port: ${{ vars.STAGING_PORT || '22' }}
          # STAGING_PASS holds the SSH private key contents, not a password
          # (naming is just a holdover from setup - value is a key file).
          ssh_private_key: ${{ secrets.STAGING_PASS }}
          local_path: './deploy/*'
          remote_path: ${{ vars.STAGING_REMOTE_PATH }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=10'
